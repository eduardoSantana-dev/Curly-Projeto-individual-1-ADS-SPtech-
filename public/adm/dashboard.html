<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/globalAdm.css">
    <link rel="stylesheet" href="css/dashboard.css">
   <script src="js/scripts/sessao.js"></script>
    <script src="https://kit.fontawesome.com/5fcf1c6510.js" crossorigin="anonymous"></script>

</head>

<body>

    <div id="nav"></div>
    <div class="container">
        <div class="contEsquerda">
            <div class="titulo">Bem vindo de volta, Eduardo</div>
            <div class="topoEsquerda">
                <div class="card cRoxo">
                    <p>Usuários</p>
                    <span id="qtdUsuarioSpan">102</span>
                </div>
                <div class="card cAzul">
                    <p>Postagens</p>
                    <span id="qtdPostsSpan">321</span>
                </div>
                <div class="acessosRapidosTopo">
                    <a href="usuarios.html">
                        <span class="circulo cRoxo"><i class="fa-regular fa-user"></i></span>
                        <span>Usuários</span>
                    </a>
                    <a href="posts.html" class="Aazul">
                        <span class="circulo cAzul"><i class="fa-regular fa-compass"></i></span>
                        <span>Postagens</span>
                    </a>

                </div>
            </div>
            <div class="graficoLinhaUsers">
                <p>Usuários nos últimos dias</p>
                <div class="grafico">
                    <canvas id="graficoLinhaUsers" width="400" height="130"></canvas>
                </div>
            </div>
            <div class="graficosRoscas">
                <div class="card">
                    <p>Usuários por tipo de cabelo</p>
                    <div>
                        <div class="grafico"> <canvas id="usersPorCurvatura"></canvas></div>
                        <div class="tiposListas" id="tiposListasUsers">
                            
                        </div>
                    </div>
                </div>
                <div class="card">
                    <p>Posts por tipo de cabelo</p>
                    <div>
                        <div class="grafico"> <canvas id="postsPorCurvatura"></canvas></div>
                        <div class="tiposListas" id="tiposListasPosts">
                            
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <div class="contDireita">
            <div class="usuariosListas">
                <div class="usuariosDash">
                    <p>Mais populares</p>
                    <div class="listaUsuario" id="listaPopularesPerfil">
                    </div>
                </div>
                <div class="usuariosDash">
                    <p>Ultimos cadastros</p>
                    <div class="listaUsuario" id="listaCadastrosPerfil">
                    </div>
                </div>
            </div>
            <div class="graficoLinhaPosts">
                <p>Interações por hora</p>
                <div class="grafico">
                    <canvas id="graficoLinhaPosts" width="400" height="150"></canvas>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="js/componentes/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/scripts/graficosDash.js"></script>
<script src="js/scripts/dashboard.js"></script>

<script>
  


</script>


</html>
